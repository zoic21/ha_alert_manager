<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="title description">
  <title id="title">Alert Manager</title>
  <desc id="description">Alert Manager wordmark with a coral alert connected to monitored sources.</desc>
  <style>
    .wordmark { fill: #123047; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #F4F7F9; }
    }
  </style>
  <g transform="translate(18 12) scale(.6875)">
    <g fill="none" stroke="#16A5A1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="128" cy="128" r="88" stroke-width="18"/>
