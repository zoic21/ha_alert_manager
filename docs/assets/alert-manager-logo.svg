<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="title description">
  <title id="title">Alert Manager</title>
  <desc id="description">Alert Manager wordmark with a central alert connected to monitored sources.</desc>
  <style>
    .outline { stroke: #123047; }
    .wordmark { fill: #123047; }
    @media (prefers-color-scheme: dark) {
      .outline { stroke: #F4F7F9; }
      .wordmark { fill: #F4F7F9; }
    }
  </style>
  <g transform="translate(18 12) scale(.6875)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle class="outline" cx="128" cy="128" r="88" stroke-width="18"/>
    <path d="M128 40V18M52 172l-19 11m171-11 19 11" stroke="#16A6A1" stroke-width="14"/>
    <circle class="outline" cx="128" cy="18" r="12" fill="#16A6A1" stroke-width="7"/>
    <circle class="outline" cx="33" cy="183" r="12" fill="#16A6A1" stroke-width="7"/>
    <circle class="outline" cx="223" cy="183" r="12" fill="#16A6A1" stroke-width="7"/>
    <path class="outline" d="M128 71 75 169h106L128 71Z" fill="#F15B5D" stroke-width="10"/>
    <path d="M128 105v31" stroke="#FFFFFF" stroke-width="12"/>
    <circle cx="128" cy="154" r="7" fill="#FFFFFF"/>
  </g>
  <g class="wordmark" font-family="Inter, Roboto, Arial, sans-serif">
    <text x="225" y="103" font-size="66" font-weight="700" letter-spacing="-2">Alert</text>
    <text x="225" y="158" font-size="54" font-weight="400" letter-spacing="-1">Manager</text>
