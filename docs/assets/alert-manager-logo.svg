    </g>
    <path d="M128 66 68 176h120Z" fill="#F15B5D" stroke="#F15B5D" stroke-width="6" stroke-linejoin="round"/>
    <path d="M128 103v30" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
