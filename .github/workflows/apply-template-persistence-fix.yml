name: Apply template persistence fix

on:
  push:
    branches:
      - fix/template-persistence-1.7.2
    paths:
      - .github/workflows/apply-template-persistence-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/template-persistence-1.7.2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply fix
        run: python .github/apply_template_persistence_fix.py

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint:frontend

      - name: Test frontend
        run: npm run test:frontend

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-template-persistence-fix.yml .github/apply_template_persistence_fix.py
          git add frontend-src/alert-manager-panel.js custom_components/alert_manager/frontend/alert-manager-panel.js tests/frontend.test.mjs CHANGELOG.md custom_components/alert_manager/manifest.json custom_components/alert_manager/const.py package.json
          git commit -m "Fix template field persistence for 1.7.2"
          git push origin HEAD:${GITHUB_REF_NAME}
