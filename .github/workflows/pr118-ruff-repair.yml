name: PR 118 Ruff repair (temporary)

on:
  push:
    branches:
      - dependabot/pip/python-minor-patch-e661181f00
    paths:
      - .github/workflows/pr118-ruff-repair.yml

permissions:
  contents: read

concurrency:
  group: pr118-ruff-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'zoic21/ha_alert_manager'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements_test.txt
      - name: Apply explicit regex patterns and verify formatting preserves semantics
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path

          replacements = {
              "tests/test_models.py": {
                  'match="Text operators?"': 'match=r"Text operators?"',
                  'match="Unknown automatic.battery field"': 'match=r"Unknown automatic\\.battery field"',
                  'match="Missing .* recovery"': 'match=r"Missing .* recovery"',
                  'match="Unknown automatic.flapping field: delay"': 'match=r"Unknown automatic\\.flapping field: delay"',
              },
              "tests/test_runtime_manager.py": {
                  'match="sensor.renamed_alert_count"': 'match=r"sensor\\.renamed_alert_count"',
              },
          }
          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in changes.items():
                  assert text.count(old) == 1, (filename, old, text.count(old))
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          for pattern, literal in (
              (r"Unknown automatic\.battery field", "Unknown automatic.battery field"),
              (r"Unknown automatic\.flapping field: delay", "Unknown automatic.flapping field: delay"),
              (r"sensor\.renamed_alert_count", "sensor.renamed_alert_count"),
          ):
              assert re.search(pattern, literal)
              assert not re.search(pattern, literal.replace(".", "X"))
          assert re.search(r"Text operators?", "Text operator")
          assert re.search(r"Text operators?", "Text operators")
          assert re.search(r"Missing .* recovery", "Missing entity setting: recovery")

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "*.py"]
          ).decode().rstrip("\0").split("\0")
          def syntax(filename):
              return ast.dump(ast.parse(Path(filename).read_text(encoding="utf-8")))
          before = {filename: syntax(filename) for filename in paths}
          subprocess.run(["ruff", "format", "."], check=True)
          for filename in paths:
              assert syntax(filename) == before[filename], f"Formatting changed semantics: {filename}"
          print("Regex matching verified; formatter preserved every Python AST.")
          PY
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m compileall -q custom_components
      - name: Commit validated corrections on the PR branch only
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/dependabot/pip/python-minor-patch-e661181f00"
          git diff --check
          git diff --stat
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git diff --cached --quiet && exit 1
          git commit -m "Fix test regex patterns and formatting for Ruff 0.16"
          git push origin "HEAD:${GITHUB_REF_NAME}"
