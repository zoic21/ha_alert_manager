name: Materialize README screenshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-readme-screenshot.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode screenshot and clean temporary files
        shell: bash
        run: |
          cat docs/assets/screenshots/alert-manager-ui.webp.b64.* | base64 --decode > docs/assets/screenshots/alert-manager-ui.webp
          rm -f docs/assets/screenshots/alert-manager-ui.webp.b64.*
          rm -f docs/assets/screenshots/overview.webp.b64
          rm -f docs/assets/screenshots/.gitkeep
          rm -f docs/assets/screenshots/README.md
          rm -f .github/workflows/materialize-readme-screenshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add Alert Manager UI screenshots"
          git push
