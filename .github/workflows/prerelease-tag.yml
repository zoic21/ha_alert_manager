name: Prerelease tag

on:
  push:
    branches:
      - main
    paths:
      - custom_components/alert_manager/manifest.json

permissions:
  contents: write

jobs:
  tag:
    name: Create prerelease tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read prerelease version
        id: version
        shell: bash
        run: |
          version=$(jq -r '.version' custom_components/alert_manager/manifest.json)
          if [[ "$version" != *-* ]]; then
            echo "The manifest version is not a prerelease; no tag will be created."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "create=true" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create tag when missing
        if: steps.version.outputs.create == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Alert Manager ${TAG}"
          git push origin "refs/tags/${TAG}"
