name: Temporary frontend cache fix

on:
  push:
    branches:
      - fix/frontend-cache-busting

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-cache-busting
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply cache fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const entryPath = 'frontend-src/alert-manager-panel-entry.js';
          let entry = fs.readFileSync(entryPath, 'utf8');
          const oldImport = 'import { AlertManagerPanel } from "./alert-manager-panel.js";';
          const newImport = [
            'const panelModuleUrl = new URL("./alert-manager-panel.js", import.meta.url);',
            'panelModuleUrl.search = new URL(import.meta.url).search;',
            'const { AlertManagerPanel } = await import(panelModuleUrl.href);',
          ].join('\n');
          if (!entry.includes(oldImport)) throw new Error('Expected static panel import was not found');
          fs.writeFileSync(entryPath, entry.replace(oldImport, newImport));

          const testPath = 'tests/frontend-coherence-mobile.test.mjs';
          let tests = fs.readFileSync(testPath, 'utf8');
          if (!tests.includes('import { readFileSync } from "node:fs";')) {
            tests = tests.replace(
              'import assert from "node:assert/strict";\n',
              'import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\n',
            );
          }
          if (!tests.includes('panel entry propagates the frontend cache query')) {
            tests += `\n\ntest("panel entry propagates the frontend cache query", () => {\n  const source = readFileSync(\n    new URL("../frontend-src/alert-manager-panel-entry.js", import.meta.url),\n    "utf8",\n  );\n  assert.match(source, /const panelModuleUrl = new URL\\("\\.\\/alert-manager-panel\\.js", import\\.meta\\.url\\);/);\n  assert.match(source, /panelModuleUrl\\.search = new URL\\(import\\.meta\\.url\\)\\.search;/);\n  assert.match(source, /await import\\(panelModuleUrl\\.href\\)/);\n  assert.doesNotMatch(source, /from "\\.\\/alert-manager-panel\\.js"/);\n});\n`;
          }
          fs.writeFileSync(testPath, tests);
          NODE
          npm run build
          npm run lint:frontend
          npm run test:frontend
      - name: Commit final branch state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-frontend-cache-fix.yml
          git add frontend-src/alert-manager-panel-entry.js custom_components/alert_manager/frontend/alert-manager-panel-entry.js tests/frontend-coherence-mobile.test.mjs
          git commit -m "Propagate frontend cache version to panel bundle"
          git push origin HEAD:fix/frontend-cache-busting
