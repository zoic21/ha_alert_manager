name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m compileall -q custom_components

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: frontend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm run build
      - run: npm run lint:frontend
      - run: npm run test:frontend
      - name: Check generated frontend bundle
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- custom_components/alert_manager/frontend
      - name: Commit generated frontend bundle
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- custom_components/alert_manager/frontend; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/alert_manager/frontend
          git commit -m "Build frontend bundle"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  home-assistant-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master 2026-08-30

  hacs:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-08-30
        with:
          category: integration
