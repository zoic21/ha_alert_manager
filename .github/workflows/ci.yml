name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m compileall -q custom_components

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run build
      - run: git diff --exit-code -- custom_components/alert_manager/frontend
      - run: npm run lint:frontend
      - run: npm run test:frontend

  home-assistant-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Publication metadata is intentionally deferred while the repository is
          # private. Keep all technical integration validations enabled.
          ignore: brands description topics
