name: Refactor test helper

on:
  push:
    branches:
      - refactor/merge-runtime-manager

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/merge-runtime-manager
      - name: Align legacy manager assertions with unified runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_manager.py")
          text = path.read_text()
          replacements = {
              'assert entry.created_task_names == ["alert_manager timer unavailable:sensor.test"]':
                  'assert entry.created_task_names == ["alert_manager state-change batch"]',
              'assert entry.created_task_names[-1] == "alert_manager pack availability"':
                  'assert entry.created_task_names[-1] == "alert_manager pack-availability batch"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected assertion missing: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git rm .github/workflows/refactor-test-helper.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align manager tests with unified runtime"
          git push origin HEAD:refactor/merge-runtime-manager