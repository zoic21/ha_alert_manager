blueprint_id: system_cpu_temperature
schema_version: 1
blueprint_version: 1
category: system
name_key: generator.system_cpu_temperature.name
description_key: generator.system_cpu_temperature.description
requirements:
  integrations:
  - systemmonitor
discovery:
  all:
  - field: integration
    equals: systemmonitor
  - field: domain
    equals: sensor
  - any:
    - field: translation_key
      equals: processor_temperature
    - field: unique_id
      equals: processor_temperature
    - field: unique_id
      glob: processor_temperature_*
  - field: unit_of_measurement
    equals: °C
rule:
  name: 'System: high CPU temperature'
  source: value
  operator: above
  value: 80
  duration: 300
