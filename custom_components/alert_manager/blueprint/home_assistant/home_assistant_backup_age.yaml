blueprint_id: home_assistant_backup_age
schema_version: 1
blueprint_version: 1
category: home_assistant
name_key: generator.home_assistant_backup_age.name
description_key: generator.home_assistant_backup_age.description
discovery:
  all:
    - field: domain
      equals: sensor
    - field: integration
      equals: backup
    - any:
        - field: translation_key
          equals: last_successful_automatic_backup
        - field: unique_id
          equals: last_successful_automatic_backup
rule:
  name: Backup alert
  source: jinja
  duration: 0
  condition_template: >-
    {% set last_backup = as_timestamp(states(entity_id), none) %}
    {{ last_backup is not none and
       ((as_timestamp(now()) - last_backup) | int) > 25 * 3600 }}
  update_message_when_active: false
  flapping_enabled: false
